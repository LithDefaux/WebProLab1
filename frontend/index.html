<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register User</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-content">
        <div class="container">
            <h2>User Registration</h2>
            <div id="formStatus" class="status-message"></div>
            <form id="registrationForm">
                <div class="form-group">
                    <label>Name <span style="color: red;">*</span></label>
                    <input type="text" id="fullName" name="fullName" required>
                    <div class="error-message" id="fullNameError">Name is required.</div>
                </div>
                <div class="form-group">
                    <label>First Name <span style="color: red;">*</span></label>
                    <input type="text" id="firstName" name="firstName" required>
                    <div class="error-message" id="firstNameError">First Name is required.</div>
                </div>
                <div class="form-group">
                    <label>Email <span style="color: red;">*</span></label>
                    <input type="email" id="email" name="email" required>
                    <div class="error-message" id="emailError">Valid email required.</div>
                </div>
                <div class="form-group">
                    <label>Phone Number <span style="color: red;">*</span></label>
                    <input type="tel" id="phone" name="phone" required pattern="[0-9]{10,15}">
                    <div class="error-message" id="phoneError">Valid phone required (10-15 digits).</div>
                </div>
                <div class="form-group">
                    <label>Skills <span style="color: red;">*</span></label>
                    <textarea id="skills" name="skills" required></textarea>
                    <div class="error-message" id="skillsError">Skills are required.</div>
                </div>
                <button type="submit">Submit Registration</button>
            </form>
        </div>
    </div>

    <div id="navbar">
        <div class="nav-links">
            <a href="index.html">Register</a>
            <a href="books.html">Books API</a>
            <a href="database.html">Database</a>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:8000/users";

        document.getElementById('registrationForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            document.querySelectorAll('.error-message').forEach(el => el.style.display = 'none');
            const statusDiv = document.getElementById('formStatus');
            statusDiv.textContent = '';
            statusDiv.className = 'status-message';

            const formData = {
                fullName: this.fullName.value.trim(),
                firstName: this.firstName.value.trim(),
                email: this.email.value.trim(),
                phone: this.phone.value.trim(),
                skills: this.skills.value.trim()
            };

            let isValid = true;
            if (!formData.fullName) { document.getElementById('fullNameError').style.display = 'block'; isValid = false; }
            if (!formData.firstName) { document.getElementById('firstNameError').style.display = 'block'; isValid = false; }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(formData.email)) { document.getElementById('emailError').style.display = 'block'; isValid = false; }
            if (!/^\d{10,15}$/.test(formData.phone)) { document.getElementById('phoneError').style.display = 'block'; isValid = false; }
            if (!formData.skills) { document.getElementById('skillsError').style.display = 'block'; isValid = false; }

            if (!isValid) return;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    statusDiv.textContent = 'User successfully registered in database!';
                    statusDiv.classList.add('success-message');
                    this.reset();
                } else {
                    throw new Error('Failed to create user');
                }
            } catch (error) {
                statusDiv.textContent = 'Error connecting to the backend server.';
                statusDiv.classList.add('error-message');
            }
        });
    </script>
</body>
</html>
